name: Build

# Every push builds the Windows installer as a downloadable artifact.
# Pushing a tag like v1.2.3 also publishes it as a GitHub Release, which the tray app updates from.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0
          choco install innosetup --no-progress -y

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          python scripts/set_version.py "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the companion starts
        shell: bash
        env:
          SC_DASH_DATA: ${{ runner.temp }}/scdata
        run: python -c "import sys; sys.path[:0]=['companion','tray']; import sc_companion as c, updater, icon; s,u=c.start(port=8799, dry_run=True); s.server_close(); print('ok', c.VERSION)"

      - name: Build app
        shell: bash
        run: |
          mkdir -p build
          python tray/icon.py build/icon.ico
          pyinstaller --noconfirm --clean --windowed --name "SC Dashboard" --icon build/icon.ico \
            --paths companion --paths tray \
            --add-data "companion/web;web" --add-data "companion/keybinds.json;." \
            --hidden-import pystray._win32 \
            tray/sc_dashboard_tray.py

      - name: Build installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\sc-dashboard.iss

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Dashboard-${{ steps.ver.outputs.version }}-Setup
          path: dist/*-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/*-Setup.exe --title "SC Dashboard ${{ steps.ver.outputs.version }}" --notes-file CHANGES.md
