name: Build

# Every push builds and tests the Windows installer.
# On main, when the number in VERSION has no release yet, it is published as a GitHub Release
# (tag v<VERSION>), which the tray app updates from. So to release: bump VERSION, update CHANGES.md, push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0
          choco install innosetup --no-progress -y

      - name: Set version
        id: ver
        shell: bash
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          python scripts/set_version.py "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the companion starts
        shell: bash
        env:
          SC_DASH_DATA: ${{ runner.temp }}/scdata
        run: python -c "import sys; sys.path[:0]=['companion','tray']; import sc_companion as c, updater, icon; s,u=c.start(port=8799, dry_run=True); s.server_close(); print('ok', c.VERSION)"

      - name: Build app
        shell: bash
        run: |
          mkdir -p build
          python tray/icon.py build/icon.ico
          pyinstaller --noconfirm --clean --windowed --name "SC Dashboard" --icon build/icon.ico \
            --paths companion --paths tray \
            --add-data "companion/web;web" --add-data "companion/keybinds.json;." \
            --hidden-import pystray._win32 \
            tray/sc_dashboard_tray.py

      - name: Build installer
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\sc-dashboard.iss

      - name: Test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-Setup.exe | Select-Object -First 1
          # -Wait would also wait for the app the installer launches, so wait for the installer only
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
          $p.WaitForExit()
          $exe = "$env:LOCALAPPDATA\Programs\SC Dashboard\SC Dashboard.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not (Get-Process "SC Dashboard" -ErrorAction SilentlyContinue)) { Start-Process $exe -ArgumentList '--no-update' }
          $ok = $false
          foreach ($i in 1..30) {
            try { $s = Invoke-RestMethod http://127.0.0.1:8770/api/status; $ok = $true; break } catch { Start-Sleep 2 }
          }
          Get-Content "$env:APPDATA\SC Dashboard\companion.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the installed app didn't answer on port 8770" }
          if ($s.version -ne "${{ steps.ver.outputs.version }}") { throw "wrong version: $($s.version)" }
          $page = Invoke-WebRequest http://127.0.0.1:8770/ -UseBasicParsing
          if ($page.Content -notmatch 'SC // DASH') { throw "dashboard page missing" }
          "installed app is serving version $($s.version)"
          Stop-Process -Name "SC Dashboard" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SC-Dashboard-${{ steps.ver.outputs.version }}-Setup
          path: dist/*-Setup.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; bump VERSION to publish a new one."
          else
            gh release create "$TAG" dist/*-Setup.exe --target "$GITHUB_SHA" \
              --title "SC Dashboard ${{ steps.ver.outputs.version }}" --notes-file CHANGES.md
          fi
